<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />
  
  <!-- App Logo / Symbol (Project Board & Checkmark) -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Main Task Card -->
    <rect x="0" y="0" width="300" height="300" rx="48" fill="#18181b" fill-opacity="0.85" />
    <rect x="0" y="0" width="300" height="300" rx="48" fill="none" stroke="#6366f1" stroke-width="6" stroke-opacity="0.5" />
    
    <!-- Top accent bar -->
    <rect x="36" y="44" width="90" height="18" rx="9" fill="#818cf8" />
    <circle cx="250" cy="53" r="10" fill="#10b981" />
    
    <!-- Checkmark icon -->
    <path d="M70 160 L125 215 L230 105" fill="none" stroke="url(#checkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
